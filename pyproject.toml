[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-dynamic-foraging-bfm-wrapper"
version = "0.1.0"
description = "Wrapper for training disentangled RNNs on AIND behavioral data"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Han Hou", email = "houhan@gmail.com"}
]

dependencies = [
    "jax==0.6.1",
    "disentangled-rnns @ git+https://github.com/AllenNeuralDynamics/aind-disentangled-rnns.git@a9b9978831cb22d37e2a75c15805c621dfe00b1f",
    "aind-analysis-arch-result-access==0.8.0",
    "aind-dynamic-foraging-basic-analysis==0.3.34",
    "aind-dynamic-foraging-data-utils==0.1.41",
    "aind-dynamic-foraging-multisession-analysis==0.0.18",
    "aind-behavior-gym==0.4.5",
    # Must stay >= 0.14.0: the Beaker image installs this package with its [bayes]
    # extra, which 0.13.0 does not define. pip does not fail on an unknown extra --
    # it exits 0 and installs without it -- so an older pin yields an image that looks
    # fine and dies on `import numpyro` at job time.
    #
    # A lower bound rather than ==, so a fix released in a later 0.14.x reaches the image.
    # An exact pin here also silently lagged: 0.14.1 carries the artifact round-trip fix
    # (models #64) that HB figure regeneration depends on, and == would have held the
    # image at 0.14.0 without it. The Dockerfile happens to mask that by editable-installing
    # the models checkout AFTER resolving these deps, but that is line ordering, not a
    # guarantee, and it does not hold for anything installing the wrapper on its own.
    "aind-dynamic-foraging-models>=0.25.0",
    "aind-dynamic-foraging-database==0.2.2",
    # pandas 3 changes the default string dtype (object -> StringDtype), which
    # the analysis code and its tests are not ported to. CI installs whatever is
    # unpinned, so without this the suite tests a stack nobody actually runs.
    "pandas<3",
    "pyarrow>=17,<22",
    "wandb~=0.23.0",
    "hydra-core~=1.3.0",
    "omegaconf~=2.3.0",
]

[project.optional-dependencies]
dev = [
    "black==25.9.0",
    "isort==7.0.0",
    # tests/test_hierarchical_synthetic.py is written against pytest, so the
    # module fails to import under `unittest discover` without it. Note that
    # declaring it only makes the module importable -- its bare `def test_*`
    # functions are still not collected by unittest. See wrapper #74.
    "pytest",
]
gpu = [
    "jax[cuda12]==0.6.1",
]
# The Stan arm of the HB baseline (model_trainers/hb_stan_trainer.py). PyStan 3 builds models through
# httpstan; no separate CmdStan install is needed. Install this extra in the launch environment.
stan = [
    "pystan>=3,<4",
    # HBStanTrainer._diagnostics imports arviz after the hours-long sample, so it has to be here: a
    # missing arviz would otherwise surface only at the end. Same line as the models package's
    # [bayes] extra (arviz 1.x needs Python >= 3.12, the version the HPC and Beaker images use).
    "arviz>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]
